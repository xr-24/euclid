<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Euclid YouTube</title>
<style>
  html, body, #player { width: 100%; height: 100%; margin: 0; background: #0a121c; }
  body { color: #bde7ff; font: 20px system-ui; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #status:empty { display: none; }
</style>
<div id="player"></div>
<div id="status" role="status">Loading YouTube…</div>
<script>
  const options = new URLSearchParams(location.hash.slice(1));
  const status = document.querySelector('#status');
  const video = options.get('v') ?? '';
  const playlist = options.get('list') ?? '';
  const index = Number(options.get('index') ?? 0);
  let player;
  let ready = false;
  let error = '';
  let looping = options.get('loop') === '1';
  const send = message => window.sendIpcMessage?.(JSON.stringify(message));
  function state() {
    if (!ready) return;
    send({ ready, error, playing: player.getPlayerState() === 1, position: player.getCurrentTime() || 0,
      index: player.getPlaylistIndex() + 1 || 0, length: player.getPlaylist()?.length ?? 0 });
  }
  function fail(message) {
    error = message;
    status.textContent = message;
    send({ ready, error, playing: false });
  }
  window.euclidVideo = command => {
    if (!ready) return;
    switch (command.action) {
      case 'play': error = ''; status.textContent = ''; player.playVideo(); break;
      case 'pause': player.pauseVideo(); break;
      case 'restart': player.seekTo(0, true); player.playVideo(); break;
      case 'next': if (playlist) player.nextVideo(); break;
      case 'previous': if (playlist) player.previousVideo(); break;
      case 'options':
        looping = Boolean(command.loop);
        player.setLoop(looping);
        player.setVolume(Math.max(0, Math.min(100, Number(command.volume))));
        break;
    }
  };
  window.onYouTubeIframeAPIReady = () => {
    const validVideo = /^[A-Za-z0-9_-]{11}$/.test(video);
    const validPlaylist = /^[A-Za-z0-9_-]{2,128}$/.test(playlist);
    if (!validVideo && !validPlaylist) return fail('This YouTube link is invalid.');
    const playerVars = { origin: location.origin, playsinline: 1 };
    if (validPlaylist) Object.assign(playerVars, { listType: 'playlist', list: playlist });
    // A playlist-only embed uses the same iframe URL as YouTube's Share > Embed.
    const params = new URLSearchParams({ ...playerVars, enablejsapi: '1' });
    const frame = document.createElement('iframe');
    frame.id = 'player';
    frame.title = 'YouTube video player';
    frame.style.border = '0';
    frame.allow = 'autoplay; encrypted-media; picture-in-picture';
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.src = `https://www.youtube.com/embed/${validVideo ? video : 'videoseries'}?${params}`;
    document.querySelector('#player').replaceWith(frame);
    player = new YT.Player('player', {
      events: {
        onReady() {
          ready = true;
          clearTimeout(deadline);
          status.textContent = '';
          if (validPlaylist && Number.isSafeInteger(index) && index > 1) {
            player.cuePlaylist({ list: playlist, index: index - 1 });
          }
          state();
        },
        onStateChange(event) {
          if (event.data === 1) { error = ''; status.textContent = ''; }
          if (event.data === 0 && !playlist && looping) {
            player.seekTo(0, true);
            player.playVideo();
          }
          state();
        },
        onError(event) {
          const message = { 100: 'This video is private or unavailable.',
            101: 'The owner disabled embedded playback.', 150: 'The owner disabled embedded playback.',
            153: 'YouTube rejected the embedded player.' }[event.data];
          fail(message ?? `YouTube playback failed (${event.data}).`);
        },
        onAutoplayBlocked() { fail('Autoplay blocked. Aim at this screen and press E to play.'); },
      },
    });
  };
  const deadline = setTimeout(() => fail('YouTube could not load. Check your connection.'), 18000);
  const script = document.createElement('script');
  script.src = 'https://www.youtube.com/iframe_api';
  script.onerror = () => fail('YouTube could not load. Check your connection.');
  document.head.appendChild(script);
  setInterval(state, 400);
</script>
</html>
